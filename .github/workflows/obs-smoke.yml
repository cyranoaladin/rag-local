name: Observability Smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  pull_request:
    paths:
      - "infra/**"
      - "docker-compose.yml"
      - "docker-compose.obs.yml"
      - "docker-compose.obs.override.yml"
      - "Makefile"
      - "metrics_quickcheck.sh"
      - "infra/scripts/metrics_quickcheck.sh"
      - "infra/scripts/obs_smoke.sh"
      - "src/ingestor/metrics.py"
      - "src/ingestor/api.py"

permissions:
  contents: read

concurrency:
  group: obs-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  obs-smoke:
    name: Compose up (obs) + quickcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (for Make targets that call python)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install CLI deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Prepare CI env file
        run: |
          mkdir -p infra
          if [ -f infra/.env.ci ]; then
            cp infra/.env.ci infra/.env
          else
            cat > infra/.env <<'ENV'
METRICS_ENABLED=true
METRICS_NAMESPACE=rag_local
INGESTOR_API_TOKEN=devtoken
INGEST_BASE_URL=http://ingestor:8001
INGEST_MAX_FILE_MB=5
MULTIMODAL_ENABLED=false
NGINX_CLIENT_MAX_BODY_SIZE=16m
NGINX_UI_UPSTREAM=ui:8501
NGINX_N8N_UPSTREAM=n8n:5678
ENV
          fi

      - name: Docker info
        run: |
          docker version
          docker compose version

      - name: Bring up obs stack
        env:
          COMPOSE_PROFILES: "db,llm,api,obs"
        run: |
          make obs-up

      - name: Smoke observability
        env:
          COMPOSE_PROFILES: "db,llm,api,obs"
        run: |
          if [ -x ./metrics_quickcheck.sh ]; then
            ./metrics_quickcheck.sh
          elif [ -x infra/scripts/metrics_quickcheck.sh ]; then
            bash infra/scripts/metrics_quickcheck.sh
          elif [ -x infra/scripts/obs_smoke.sh ]; then
            bash infra/scripts/obs_smoke.sh
          else
            echo "::warning::No quickcheck script found. Doing basic probe."
            sleep 10
            curl -fsS http://127.0.0.1:9090/-/healthy
          fi

      - name: Dump docker ps (always)
        if: always()
        run: |
          docker ps -a
          docker compose ls

      - name: Compose logs (always)
        if: always()
        run: |
          docker compose logs --no-color > compose-logs.txt || true
          tail -n +1 compose-logs.txt | sed -n '1,400p'

      - name: Upload compose logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obs-compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore

      - name: Tear down obs stack (always)
        if: always()
        env:
          COMPOSE_PROFILES: "db,llm,api,obs"
        run: |
          make obs-down
