name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  qa:
    name: Lint / Type / Tests / Obs smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dev deps
        run: |
          python -m pip install -U pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint / Type / Tests
        run: |
          if [ -f Makefile ]; then
            make lint || ruff check .
            make typecheck || mypy src
          else
            ruff check .
            mypy src
          fi
          python -m pytest -q

      - name: Spin up obs profile (loopback only) and smoke it
        env:
          COMPOSE_PROFILES: api,obs
        run: |
          if [ -f infra/.env.ci ]; then ENV_FILE="infra/.env.ci"; else ENV_FILE="infra/.env"; fi

          docker compose -f infra/docker-compose.yml \
                         -f infra/docker-compose.obs.yml \
                         -f infra/docker-compose.obs.override.yml \
                         --env-file "${ENV_FILE}" \
                         --profile api --profile obs \
                         up -d --remove-orphans

          sleep 5

          if [ -f infra/scripts/obs_smoke.sh ]; then
            bash infra/scripts/obs_smoke.sh
          else
            curl -fsS http://127.0.0.1:19090/api/v1/status/runtimeinfo >/dev/null
            curl -fsS http://127.0.0.1:19090/api/v1/targets | jq -e '.data.activeTargets | length >= 1' >/dev/null
          fi

      - name: Tear down
        if: always()
        run: |
          docker compose -f infra/docker-compose.yml \
                         -f infra/docker-compose.obs.yml \
                         -f infra/docker-compose.obs.override.yml \
                         down -v
